name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    name: Skill and manifest structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate skills, manifests and marketplace
        run: python3 scripts/validate.py

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax check
        run: |
          bash -n install.sh
          bash -n scripts/test_install_sh.sh
          bash -n scripts/test_check_sh.sh
          bash -n plugins/flutter-code-quality/skills/review-gate/scripts/check.sh
          bash -n plugins/flutter-code-quality/skills/review-gate/scripts/prepare.sh
      - name: shellcheck
        run: |
          shellcheck \
            install.sh \
            scripts/test_install_sh.sh \
            scripts/test_check_sh.sh \
            plugins/flutter-code-quality/skills/review-gate/scripts/check.sh \
            plugins/flutter-code-quality/skills/review-gate/scripts/prepare.sh
      - name: Installer behaves
        run: bash scripts/test_install_sh.sh

  python:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff==0.16.5 pillow numpy
      - name: Lint
        run: ruff check scripts plugins
      - name: Compile
        run: |
          python3 -m py_compile scripts/validate.py
          python3 -m py_compile plugins/flutter-design-fidelity/skills/visual-verification/scripts/compare.py
      - name: Git scope regression tests
        run: python3 scripts/test_scope.py
      - name: compare.py behaves
        run: python3 scripts/test_compare.py

  gate:
    name: review-gate self-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter: ['3.41.9', '3.47.8']
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
      - name: Parser package and tests
        working-directory: plugins/flutter-code-quality/skills/review-gate/scripts/dart_checks
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Executable examples and capture harness
        run: python3 scripts/test_flutter_examples.py
      - name: Run the gate against its fixture
        run: bash scripts/test_check_sh.sh
